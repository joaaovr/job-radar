name: Instalar versão final do JobRadar

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instalar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do projeto atual
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Localizar pacote final
        run: |
          test -f "JobRadar_FINAL_Comercial_13_Fontes.zip"

      - name: Extrair versão final
        run: |
          rm -rf /tmp/jobradar-final
          mkdir -p /tmp/jobradar-final
          unzip -q "JobRadar_FINAL_Comercial_13_Fontes.zip" -d /tmp/jobradar-final

      - name: Substituir código pela versão final
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/instalar-versao-final.yml' \
            --exclude='JobRadar_FINAL_Comercial_13_Fontes.zip' \
            /tmp/jobradar-final/ ./

      - name: Salvar nova versão
        run: |
          git config user.name "jobradar-bot"
          git config user.email "jobradar-bot@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nenhuma alteração encontrada."
            exit 0
          fi

          git commit -m "chore: instala versão final personalizada do JobRadar"
          git push
